[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-integration-platform"
version = "2.1.0"
description = "Integrated Surface Analysis Platform (SFE, V-SAMS, SG-TERRA)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "HyunchanAn" }
]
dependencies = [
    "streamlit>=1.39.0",
    "streamlit-drawable-canvas",
    "streamlit-javascript",
    "streamlit-image-coordinates",
    "plotly>=5.10.0",
    "opencv-python-headless",
    "timm",
    "Pillow>=11.0.0",
    "albumentations",
    "scikit-learn",
    "numpy>=1.26.0",
    "scipy",
    "pandas",
    "matplotlib",
    "tqdm",
    "huggingface_hub",
    "requests",
    "pydantic>=2.0.0",
    "torch",
    "torchvision",
    "sam-2 @ git+https://github.com/facebookresearch/segment-anything-2.git",
    "mobile-sam @ git+https://github.com/ChaoningZhang/MobileSAM.git"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "isort",
    "pre-commit"
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.black]
line-length = 120
target-version = ['py310']
