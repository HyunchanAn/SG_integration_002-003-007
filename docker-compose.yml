version: '3.8'

services:
  integrated-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sg_integrated_dashboard
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
